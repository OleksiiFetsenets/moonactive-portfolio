<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <style><![CDATA[
    .bg      { fill: #120a09; }
    .card    { fill: #1c100e; stroke: #3a231d; stroke-width: 1.5; }
    .title   { fill: #ffc46b; font-size: 34px; font-weight: 600; letter-spacing: .5px; }
    .sub     { fill: #9b8378; font-size: 15px; }
    .h       { fill: #ff8a5c; font-size: 19px; font-weight: 600; letter-spacing: .4px; }
    .body    { fill: #cdbcb2; font-size: 14.5px; }
    .dim     { fill: #9b8378; font-size: 13.5px; }
    .mono    { fill: #ffd9a8; font-size: 13.5px; font-family: ui-monospace, Menlo, monospace; }
    .tagbg   { fill: #33201a; stroke: #52362c; }
    .tag     { fill: #ffc46b; font-size: 12px; font-weight: 600; }
    .stepbg  { fill: #2a1712; stroke: #4a2c22; }
    .stept   { fill: #f2e7de; font-size: 14px; font-weight: 600; }
    .stepd   { fill: #9b8378; font-size: 12px; }
    .arrow   { fill: #ff8a5c; font-size: 20px; font-weight: 700; }
    .warn    { fill: #ffb3a0; font-size: 13.5px; }
    .tree    { fill: #e7d9cf; font-size: 13.5px; font-family: ui-monospace, Menlo, monospace; }
    .treed   { fill: #9b8378; font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; }
  ]]></style>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <text class="title" x="40" y="58">Coinfall — architecture</text>
  <text class="sub" x="40" y="86">Unity 6 demo · spin → coins → base → upgrade · one owner per concern</text>

  <!-- Card 1: Layers -->
  <rect class="card" x="40" y="110" width="740" height="380" rx="14"/>
  <text class="h" x="64" y="146">Layers</text>

  <rect class="tagbg" x="64" y="164" width="66" height="22" rx="11"/>
  <text class="tag" x="76" y="180">Core</text>
  <text class="mono" x="142" y="180">Assets/Coinfall/Scripts/Core/</text>
  <text class="dim" x="64" y="202">Pure C#, noEngineReferences. Economy, SlotMachine, SymbolTable, VillageMap,</text>
  <text class="dim" x="64" y="220">RaidSystem, GameState. Seeded and unit-testable.</text>

  <rect class="tagbg" x="64" y="238" width="66" height="22" rx="11"/>
  <text class="tag" x="76" y="254">Game</text>
  <text class="mono" x="142" y="254">Scripts/Game/Views/</text>
  <text class="dim" x="64" y="276">GameUI (HUD, reels, overlays), MapView (terrain + nodes), UiKit (uGUI</text>
  <text class="dim" x="64" y="294">factory), SpriteLibrary, UiLayoutCheck.</text>

  <rect class="tagbg" x="64" y="312" width="82" height="22" rx="11"/>
  <text class="tag" x="76" y="328">Adapters</text>
  <text class="mono" x="158" y="328">Scripts/Game/Adapters/</text>
  <text class="dim" x="64" y="350">PlayerPrefsStore implements the Core IStore port. Swap for cloud or file</text>
  <text class="dim" x="64" y="368">without touching Core.</text>

  <rect class="tagbg" x="64" y="386" width="66" height="22" rx="11"/>
  <text class="tag" x="76" y="402">Editor</text>
  <text class="mono" x="142" y="402">Scripts/Editor/</text>
  <text class="dim" x="64" y="424">BuildScript (macOS / Android play / Android capture), CreateMainScene,</text>
  <text class="dim" x="64" y="442">SpriteImportPostprocessor.</text>

  <rect class="tagbg" x="64" y="460" width="60" height="22" rx="11"/>
  <text class="tag" x="76" y="476">Tests</text>
  <text class="mono" x="136" y="476">Tests/EditMode/</text>
  <text class="dim" x="64" y="498">NUnit over Core, including a 200k-spin RTP simulation; same assertions</text>
  <text class="dim" x="64" y="516">run outside Unity via dotnet.</text>

  <!-- Card 2: Game loop -->
  <rect class="card" x="820" y="110" width="740" height="380" rx="14"/>
  <text class="h" x="844" y="146">Game loop (Core)</text>

  <rect class="stepbg" x="844" y="162" width="150" height="52" rx="10"/>
  <text class="stept" x="868" y="186">SPIN</text>
  <text class="stepd" x="868" y="204">−1 energy</text>

  <text class="arrow" x="1004" y="194">→</text>

  <rect class="stepbg" x="1030" y="162" width="150" height="52" rx="10"/>
  <text class="stept" x="1054" y="186">COINS</text>
  <text class="stepd" x="1054" y="204">× base multiplier</text>

  <text class="arrow" x="1190" y="194">→</text>

  <rect class="stepbg" x="1216" y="162" width="150" height="52" rx="10"/>
  <text class="stept" x="1240" y="186">UPGRADE</text>
  <text class="stepd" x="1240" y="204">4 buildings</text>

  <rect class="stepbg" x="844" y="232" width="150" height="52" rx="10"/>
  <text class="stept" x="868" y="256">RAID</text>
  <text class="stepd" x="868" y="274">token → steal</text>

  <text class="arrow" x="1004" y="264">→</text>

  <rect class="stepbg" x="1030" y="232" width="150" height="52" rx="10"/>
  <text class="stept" x="1054" y="256">SHIELDS</text>
  <text class="stepd" x="1054" y="274">absorb counter</text>

  <text class="arrow" x="1190" y="264">→</text>

  <rect class="stepbg" x="1216" y="232" width="150" height="52" rx="10"/>
  <text class="stept" x="1240" y="256">BUY BASE</text>
  <text class="stepd" x="1240" y="274">×2.2 cost</text>

  <text class="body" x="844" y="322">Max all four buildings in the working base and it is cleared: the next</text>
  <text class="body" x="844" y="342">owned base becomes current. Eight bases, each paying more and costing</text>
  <text class="body" x="844" y="362">more. Payout multiplier per base scales 1.0 → 1.9&#8319;.</text>

  <text class="dim" x="844" y="398">Determinism: SlotMachine takes a seed, RTP is measured not assumed</text>
  <text class="dim" x="844" y="416">(0.99 at 200k spins), and every state change goes through GameState.</text>
  <text class="dim" x="844" y="434">Views read Core and raise intents; they never mutate it directly.</text>

  <text class="dim" x="844" y="466">Save format is one flat pipe-delimited string behind IStore — small,</text>
  <text class="dim" x="844" y="482">versionable, and testable with an in-memory store.</text>

  <!-- Card 3: Rendering -->
  <rect class="card" x="40" y="510" width="740" height="230" rx="14"/>
  <text class="h" x="64" y="546">Rendering</text>

  <rect class="stepbg" x="64" y="558" width="150" height="30" rx="8"/>
  <text class="mono" x="78" y="578">Coinfall/Sand</text>
  <rect class="stepbg" x="226" y="558" width="150" height="30" rx="8"/>
  <text class="mono" x="240" y="578">Coinfall/Dune</text>
  <rect class="stepbg" x="388" y="558" width="190" height="30" rx="8"/>
  <text class="mono" x="402" y="578">Coinfall/SymbolToon</text>

  <text class="dim" x="64" y="612">All three are UI shaders honouring _ClipRect, so they compose with RectMask2D.</text>
  <text class="dim" x="64" y="630">Sand: 3-octave value noise + UV scroll. Dune: analytic sine ridge, per-layer</text>
  <text class="dim" x="64" y="648">parallax. SymbolToon: 4-band posterise + alpha-derived outline on reel symbols.</text>

  <text class="dim" x="64" y="674">Built-in pipeline; URP deliberately absent — nothing here needs lighting.</text>
  <text class="dim" x="64" y="692">Map nodes are procedural sprites: Fort() for a landed base, Ship() for a locked</text>
  <text class="dim" x="64" y="710">one still flying in. The path band is derived from node size, so no base can</text>
  <text class="dim" x="64" y="728">float above the sand.</text>

  <!-- Card 4: Verification -->
  <rect class="card" x="820" y="510" width="740" height="230" rx="14"/>
  <text class="h" x="844" y="546">Verification adapters</text>

  <rect class="tagbg" x="844" y="558" width="92" height="22" rx="11"/>
  <text class="tag" x="856" y="574">in-engine</text>
  <text class="dim" x="948" y="574">-autoshot walkthrough: raycast hit-tests, layout oracle, motion diff</text>

  <rect class="tagbg" x="844" y="590" width="92" height="22" rx="11"/>
  <text class="tag" x="856" y="606">desktop</text>
  <text class="dim" x="948" y="606">4 resolutions × 3 UI states, 0 problems</text>

  <rect class="tagbg" x="844" y="622" width="92" height="22" rx="11"/>
  <text class="tag" x="856" y="638">rapp</text>
  <text class="dim" x="948" y="638">Android install / launch / capture on 1080×2220, GLES3</text>

  <rect class="tagbg" x="844" y="654" width="92" height="22" rx="11"/>
  <text class="tag" x="856" y="670">rui</text>
  <text class="warn" x="948" y="670">web-only: a Unity player has no DOM, so it cannot see this build</text>

  <text class="dim" x="844" y="702">rui is reserved for the web surfaces a store launch needs: landing page,</text>
  <text class="dim" x="844" y="720">privacy/support pages, WebGL demo.</text>

  <!-- Card 5: Runtime object graph -->
  <rect class="card" x="40" y="760" width="1520" height="204" rx="14"/>
  <text class="h" x="64" y="796">Runtime object graph</text>

  <text class="tree" x="64" y="826">Bootstrap</text>
  <text class="treed" x="176" y="826">(RuntimeInitializeOnLoadMethod)</text>

  <text class="tree" x="64" y="850">└─ Coinfall</text>
  <text class="treed" x="176" y="850">DontDestroyOnLoad</text>

  <text class="tree" x="88" y="874">└─ GameUI</text>
  <text class="treed" x="200" y="874">owns the single GameState; input becomes Core commands</text>

  <text class="tree" x="112" y="898">├─ Canvas</text>
  <text class="treed" x="216" y="898">HUD · reels · ledger · SPIN / MAP / RAID</text>

  <text class="tree" x="112" y="922">├─ VillageOverlay ── MapRegion ── MapView</text>
  <text class="treed" x="480" y="922">sky · dunes · sand · dust · 8 nodes · trail</text>

  <text class="tree" x="112" y="946">│                 └─ Actions ── upgrade rows · BUY base</text>

  <text class="tree" x="112" y="970">└─ RaidOverlay ── rivals · ATTACK</text>
  <text class="treed" x="380" y="970">GameState → RaidSystem → shields / steal</text>
</svg>
